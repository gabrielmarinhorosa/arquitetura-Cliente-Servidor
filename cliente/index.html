<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livraria · Cliente-Servidor</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 small { font-size: .5em; color: #888; font-weight: normal; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    section h2 { margin-top: 0; }
    table { width: 100%; border-collapse: collapse; margin: .5rem 0; }
    th, td { text-align: left; padding: .4rem; border-bottom: 1px solid #eee; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .5rem; }
    input, select { padding: .4rem; flex: 1; min-width: 110px; }
    button { padding: .4rem .9rem; cursor: pointer; }
    .msg { padding: .5rem; border-radius: 4px; background: #e3f6e3; color: #165c16; }
    .msg.erro { background: #fde2e2; color: #900; }
    .total { text-align: right; font-weight: bold; }
    .servidor { font-size: .8rem; color: #666; }
  </style>
</head>
<body>
  <h1>📚 Livraria <small>cliente-servidor</small></h1>
  <p class="servidor">Servidor: <code id="url-servidor"></code></p>
  <p id="mensagem" class="msg" hidden></p>

  <section>
    <h2>Catálogo</h2>
    <table>
      <thead><tr><th>#</th><th>Título</th><th>Autor</th><th>Preço</th><th>Estoque</th><th></th></tr></thead>
      <tbody id="livros"><tr><td colspan="6">Carregando…</td></tr></tbody>
    </table>
    <form id="form-livro">
      <input name="titulo" placeholder="Título" required>
      <input name="autor" placeholder="Autor" required>
      <input name="preco" type="number" step="0.01" min="0" placeholder="Preço" required>
      <input name="estoque" type="number" min="0" placeholder="Estoque" required>
      <button>Cadastrar livro</button>
    </form>
  </section>

  <section>
    <h2>Carrinho</h2>
    <div id="carrinho"></div>
    <form id="form-pedido">
      <input name="cliente" placeholder="Seu nome" required>
      <select name="metodo">
        <option value="pix">PIX</option>
        <option value="cartao">Cartão</option>
      </select>
      <button>Finalizar compra</button>
    </form>
  </section>

  <section>
    <h2>Pedidos</h2>
    <div id="pedidos"></div>
  </section>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
